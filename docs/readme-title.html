<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>README title image</title>
<!-- README title image with the photo (docs/images/readme-photo.webp, AI-generated).
     Rendered at 1280x640, device scale 2, once with ?theme=light and once with ?theme=dark,
     to docs/images/readme-title-light.png and readme-title-dark.png (headless Chrome). -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #F4F6FA; --bg-2: #E4EAF3; --ink: #0E1320; --ink-2: #4A5468; --accent-text: #005BB0; --accent: #0070D1; --accent-2: #5AA6FF;
    --glow-1: rgba(0,112,209,0.16); --pill-bg: #ffffff; --pill-line: rgba(14,30,60,0.08); --fade: #EDF1F7; }
  :root.dark { --bg: #050B17; --bg-2: #0B1F3D; --ink: #F2F5FA; --ink-2: rgba(214,224,240,0.84); --accent-text: #5AA6FF; --accent: #2E8CFF; --accent-2: #5AA6FF;
    --glow-1: rgba(0,112,209,0.30); --pill-bg: rgba(255,255,255,0.05); --pill-line: rgba(255,255,255,0.14); --fade: #071226; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1280px; height: 640px; overflow: hidden; position: relative; color: var(--ink); font-family: "Inter", -apple-system, system-ui, sans-serif;
    background: radial-gradient(760px 520px at 16% 34%, var(--glow-1), transparent 62%), linear-gradient(135deg, var(--bg-2) 0%, var(--bg) 70%); }
  .photo { position: absolute; right: 0; top: 0; height: 640px; width: 698px; background: url(images/readme-photo.webp) center / cover no-repeat;
    -webkit-mask-image: linear-gradient(to right, transparent 0, rgba(0,0,0,0.55) 16%, #000 34%); mask-image: linear-gradient(to right, transparent 0, rgba(0,0,0,0.55) 16%, #000 34%); }
  .photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, var(--fade) 0, transparent 22%); opacity: .55; }
  .left { position: absolute; left: 72px; top: 0; bottom: 0; width: 500px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 74px; height: 74px; border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.22); }
  .brand h1 { font-family: "Archivo", sans-serif; font-weight: 800; font-size: 64px; letter-spacing: -0.03em; line-height: 1; white-space: nowrap; }
  .eyebrow { margin-top: 18px; font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent-text); }
  .lead { margin-top: 26px; font-family: "Archivo", sans-serif; font-weight: 700; font-size: 38px; letter-spacing: -0.02em; line-height: 1.08; }
  .lead em { font-style: normal; color: var(--accent-text); }
  .sub { margin-top: 16px; font-size: 18px; line-height: 1.45; color: var(--ink-2); max-width: 450px; }
  .pills { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { font-family: "JetBrains Mono", monospace; font-size: 12px; font-weight: 500; padding: 7px 12px; border-radius: 999px; background: var(--pill-bg);
    border: 1px solid var(--pill-line); color: var(--ink-2); display: inline-flex; align-items: center; gap: 7px; }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .pill.v i { background: var(--accent-2); }
</style>
<script>if (/theme=dark/.test(location.search)) document.documentElement.classList.add('dark');</script>
</head>
<body>
  <div class="photo"></div>
  <div class="left">
    <div class="brand"><img src="images/readme-icon.png" alt=""><h1>PlayStation 5</h1></div>
    <div class="eyebrow">For Home Assistant</div>
    <div class="lead">Your PS5, <em>fully local.</em></div>
    <div class="sub">Status, wake-up and rest mode for the PS5 in Home Assistant, without cloud, MQTT or an extra app. Current game and trophies optional from the PSN cloud.</div>
    <div class="pills"><span class="pill"><i></i>Local, no cloud</span><span class="pill v"><i></i>Platinum</span><span class="pill"><i></i>HACS</span></div>
  </div>
</body>
</html>
